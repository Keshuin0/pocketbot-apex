name: Windows Quant CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Quant Test Suite & Security Audit
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up 64-bit Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Run Repository Security & Integrity Audit
        run: |
          python tools/repo_security_audit.py

      - name: Verify AST Bytecode Compilation
        run: |
          python -m compileall v1-classic v2-apex

      - name: Install Quantitative Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2-apex/requirements.txt

      - name: Execute Apex Verification Test Suite
        env:
          GITHUB_ACTIONS: "true"
          PYTHONPATH: "v2-apex"
        run: |
          pytest v2-apex/tests/ -v --color=yes
