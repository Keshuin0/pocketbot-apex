name: Package & Release Portable Windows ZIPs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    name: Build Portable ZIP Distributions
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify Security & Integrity
        run: |
          python tools/repo_security_audit.py

      - name: Package Portable ZIP Distributions
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          
          Write-Host "Packaging PocketBot v1 Classic..."
          Compress-Archive -Path "v1-classic\*" -DestinationPath "dist\PocketBot_v1_Classic_Portable_Windows.zip" -Force
          
          Write-Host "Packaging PocketBot Apex v2..."
          Compress-Archive -Path "v2-apex\*" -DestinationPath "dist\PocketBot_Apex_v2_Portable_Windows.zip" -Force
          
          Write-Host "Computing SHA256 Checksums..."
          Get-FileHash -Path "dist\*.zip" -Algorithm SHA256 | ForEach-Object {
              "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))"
          } | Out-File -FilePath "dist\SHA256SUMS.txt" -Encoding ascii
          
          Get-Content dist\SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/PocketBot_v1_Classic_Portable_Windows.zip
            dist/PocketBot_Apex_v2_Portable_Windows.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
